<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Criar conta | GYAMAX</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="login-page">


    <main class="login-container">


        <div class="login-box">


            <a
                href="index.html"
                class="login-logo"
            >

                <img
                    src="img/GYAMAX.png"
                    alt="GYAMAX"
                >

            </a>


            <span
                class="login-tag"
                data-i18n="login.tag"
            >
                ÁREA DO CLIENTE
            </span>


            <h1 data-i18n="register.title">
                Crie sua conta.
            </h1>


            <p
                class="login-description"
                data-i18n="register.description"
            >
                Cadastre-se para acompanhar seus projetos
                e solicitações na GYAMAX.
            </p>


            <div
                id="registerMessage"
                class="form-message"
            ></div>


            <form
                id="registerForm"
                autocomplete="on"
            >


                <div class="input-group">

                    <label
                        for="name"
                        data-i18n="register.name"
                    >
                        Nome
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Seu nome"
                        data-i18n-placeholder="register.namePlaceholder"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="input-group">

                    <label
                        for="email"
                        data-i18n="register.email"
                    >
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seu@email.com"
                        data-i18n-placeholder="register.emailPlaceholder"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label
                        for="password"
                        data-i18n="register.password"
                    >
                        Senha
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Crie uma senha"
                        data-i18n-placeholder="register.passwordPlaceholder"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="input-group">

                    <label
                        for="confirm-password"
                        data-i18n="register.confirmPassword"
                    >
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirmPassword"
                        placeholder="Digite a senha novamente"
                        data-i18n-placeholder="register.confirmPasswordPlaceholder"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn login-button"
                    data-i18n="register.submit"
                >
                    Criar conta
                </button>


            </form>


            <div class="login-divider">

                <span data-i18n="common.or">
                    ou
                </span>

            </div>


            <p class="create-account">

                <span data-i18n="register.hasAccount">
                    Já possui uma conta?
                </span>

                <a
                    href="login.html"
                    data-i18n="register.login"
                >
                    Entrar
                </a>

            </p>


            <a
                href="index.html"
                class="back-home"
                data-i18n="common.backHome"
            >
                ← Voltar para o site
            </a>


        </div>


    </main>


    <script src="script.js"></script>

</body>

</html>
